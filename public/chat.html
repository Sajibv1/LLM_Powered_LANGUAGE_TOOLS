<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Conversation Tutor</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    /* Custom scrollbar handling */
    .chat-container::-webkit-scrollbar {
      width: 6px;
    }
    .chat-container::-webkit-scrollbar-thumb {
      background-color: rgba(156, 163, 175, 0.5);
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col font-sans">

  <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-xs flex justify-between items-center shrink-0">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center text-white text-xl font-bold">💬</div>
      <div>
        <h1 class="text-lg font-semibold text-slate-800">AI English Tutor</h1>
        <p class="text-xs text-emerald-600 font-medium flex items-center">
          <span class="w-2 h-2 bg-emerald-500 rounded-full inline-block mr-1"></span> Online
        </p>
      </div>
    </div>
  </header>

  <main id="chat-container" class="chat-container flex-1 overflow-y-auto p-4 md:p-6 space-y-4 max-w-4xl w-full mx-auto">
    <div class="flex items-start gap-3">
      <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center shrink-0 text-indigo-600 font-bold text-sm">AI</div>
      <div class="bg-white p-4 rounded-2xl rounded-tl-none shadow-xs border border-slate-100 max-w-[85%] text-slate-700">
        Hi there! I'm your English practice companion. Tell me, how was your day today? Don't worry about making mistakes!
      </div>
    </div>
  </main>

  <footer class="bg-white border-t border-slate-200 p-4 shrink-0 shadow-sm">
    <form id="chat-form" class="max-w-4xl mx-auto flex gap-3 items-center">
      <input 
        type="text" 
        id="user-input" 
        placeholder="Type your message here..." 
        autocomplete="off"
        class="flex-1 border border-slate-300 rounded-xl px-4 py-3 text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
        required
      />
      <button 
        type="submit" 
        id="send-btn"
        class="bg-indigo-600 hover:bg-indigo-700 active:scale-98 text-white px-5 py-3 rounded-xl font-medium shadow-md transition-all flex items-center gap-1 cursor-pointer disabled:opacity-50"
      >
        <span>Send</span>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
        </svg>
      </button>
    </form>
  </footer>

  <script>
    // State array keeping track of API history payload format
    const messages = [];
    
    const chatContainer = document.getElementById("chat-container");
    const chatForm = document.getElementById("chat-form");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    function scrollToBottom() {
      chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
    }

    // Append standard user text elements
    function appendUserMessage(text) {
      const wrapper = document.createElement("div");
      wrapper.className = "flex items-start gap-3 justify-end";
      wrapper.innerHTML = `
        <div class="bg-indigo-600 p-4 rounded-2xl rounded-tr-none shadow-xs text-white max-w-[85%]">
          ${escapeHTML(text)}
        </div>
      `;
      chatContainer.appendChild(wrapper);
      scrollToBottom();
    }

    // Append assistant content element containing native replies alongside dynamic feedback boxes
    function appendTutorMessage(reply, correction) {
      const wrapper = document.createElement("div");
      wrapper.className = "flex items-start gap-3";
      
      let correctionHTML = "";
      if (correction) {
        const alternativesHTML = correction.alternatives
          .map(alt => `<li class="italic text-slate-600 text-xs mt-1">“${escapeHTML(alt)}”</li>`)
          .join("");

        correctionHTML = `
          <div class="mt-3 bg-amber-50 border border-amber-200 rounded-xl p-3 text-sm text-amber-900 shadow-2xs">
            <div class="flex items-center gap-1.5 font-semibold text-amber-800 mb-1">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
              </svg>
              <span>Tutor Insight</span>
            </div>
            <p class="font-medium text-xs text-slate-500 uppercase tracking-wider mt-2">Better way to say it:</p>
            <p class="text-slate-800 font-medium">“${escapeHTML(correction.corrected)}”</p>
            
            <p class="font-medium text-xs text-slate-500 uppercase tracking-wider mt-2">Why?</p>
            <p class="text-slate-700 text-xs">${escapeHTML(correction.explanation)}</p>
            
            ${alternativesHTML ? `
              <p class="font-medium text-xs text-slate-500 uppercase tracking-wider mt-2">Alternative phrases:</p>
              <ul class="list-disc pl-4">${alternativesHTML}</ul>
            ` : ""}
          </div>
        `;
      }

      wrapper.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center shrink-0 text-indigo-600 font-bold text-sm">AI</div>
        <div class="bg-white p-4 rounded-2xl rounded-tl-none shadow-xs border border-slate-100 max-w-[85%] text-slate-700">
          <p class="leading-relaxed">${escapeHTML(reply)}</p>
          ${correctionHTML}
        </div>
      `;
      chatContainer.appendChild(wrapper);
      scrollToBottom();
    }

    // Appends a temporary loading skeleton animation 
    function appendLoadingIndicator() {
      const wrapper = document.createElement("div");
      wrapper.id = "loading-indicator";
      wrapper.className = "flex items-start gap-3";
      wrapper.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center shrink-0 text-indigo-600 font-bold text-sm">AI</div>
        <div class="bg-white p-4 rounded-2xl rounded-tl-none shadow-xs border border-slate-100 w-32">
          <div class="flex space-x-2 justify-center items-center py-1">
            <div class="h-2 w-2 bg-slate-400 rounded-full animate-bounce [animation-delay:-0.3s]"></div>
            <div class="h-2 w-2 bg-slate-400 rounded-full animate-bounce [animation-delay:-0.15s]"></div>
            <div class="h-2 w-2 bg-slate-400 rounded-full animate-bounce"></div>
          </div>
        </div>
      `;
      chatContainer.appendChild(wrapper);
      scrollToBottom();
    }

    function removeLoadingIndicator() {
      const loader = document.getElementById("loading-indicator");
      if (loader) loader.remove();
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Handle standard submission execution logic
    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      // Update UI and runtime states
      appendUserMessage(text);
      messages.push({ role: "user", content: text });
      userInput.value = "";
      
      // Control input interface lock states
      userInput.disabled = true;
      sendBtn.disabled = true;
      appendLoadingIndicator();

      try {
        // Dispatches payload straight to Netlify function URL destination
        const response = await fetch("/.netlify/functions/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages })
        });

        if (!response.ok) throw new Error("Network request failed");
        
        const data = await response.json();
        removeLoadingIndicator();
        
        // Append response layout elements
        appendTutorMessage(data.reply, data.correction);
        
        // Ensure conversation memory stores the absolute assistant text string contextual fallback
        messages.push({ role: "assistant", content: data.reply });

      } catch (err) {
        console.error(err);
        removeLoadingIndicator();
        appendTutorMessage("Sorry, I ran into an connection error. Please try sending your message again.", null);
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    });
  </script>
</body>
</html>
